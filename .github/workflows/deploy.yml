name: Deploy to server (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    env:
      # postinstall (prisma generate) требует DATABASE_URL при CI=true; к БД не подключается
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Deploy app and configure local snapshots
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR=/opt/kpd/app
            ENV_FILE="$APP_DIR/.env.local"
            SNAPSHOT_DIR=/opt/kpd/snapshots
            SNAPSHOT_USER=kpd-app

            if [ ! -f "$ENV_FILE" ]; then
              echo "[deploy] FAIL: отсутствует $ENV_FILE" >&2
              exit 1
            fi

            upsert_env() {
              local key="$1" value="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
              else
                printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE"
              fi
            }

            # Снимки на VPS — локальная папка (не Neon/S3)
            upsert_env SNAPSHOT_STORAGE_MODE local
            upsert_env SNAPSHOT_LOCAL_DIR "$SNAPSHOT_DIR"

            if ! id "$SNAPSHOT_USER" >/dev/null 2>&1; then
              useradd --system --home-dir /nonexistent --shell /usr/sbin/nologin "$SNAPSHOT_USER"
            fi
            install -d -o "$SNAPSHOT_USER" -g "$SNAPSHOT_USER" -m 0750 "$SNAPSHOT_DIR"
            chgrp "$SNAPSHOT_USER" "$ENV_FILE"
            chmod 0640 "$ENV_FILE"

            bash "$APP_DIR/deploy/server-deploy.sh"
